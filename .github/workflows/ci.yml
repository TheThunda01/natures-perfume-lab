name: Reproduce and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify recorded results and explorer data
        run: python verify_results.py --results-dir results --web-dir web
      - name: Reproduce the analysis
        run: python run.py --output-dir .reproduction
      - name: Verify saved outputs
        run: python verify_results.py --results-dir .reproduction
      - name: Check documentation
        run: python scripts/check_docs.py
